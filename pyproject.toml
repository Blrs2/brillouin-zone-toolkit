[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brillouin-zone-toolkit"
version = "0.1.0"
description = "A reproducible Python toolkit for reciprocal lattices and first Brillouin zones"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Bruno Leão Rennó Salomon" },
]
dependencies = [
  "numpy>=1.23",
]
keywords = ["solid state physics", "crystallography", "Brillouin zone", "reciprocal lattice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["matplotlib>=3.6", "pytest>=7", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/Blrs2/brillouin-zone-toolkit"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
